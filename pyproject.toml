[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxx"
version = "0.1.0"
description = "Official Python SDK for the Fluxx control plane API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fluxx" }]
keywords = ["fluxx", "observability", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://fluxx.dev"
Documentation = "https://docs.fluxx.dev"
Repository = "https://github.com/shregar1/py.package.fluxx.vexarr.com"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxx"]
